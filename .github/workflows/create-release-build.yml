name: Release
on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: Choose release type
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      beta:
        type: boolean
        description: Prerelease
        default: false
      dry:
        type: boolean
        description: Dry release
        default: false
      backend_repository:
        type: string
        description: Backend repo (owner/bublik), including public forks
        required: false
        default: ''
      backend_ref:
        type: string
        description: Backend branch, tag, or SHA
        required: false
        default: main
      docker_repository:
        type: string
        description: Docker repo (owner/bublik-docker), including public forks
        required: false
        default: ''
      docker_ref:
        type: string
        description: Docker branch, tag, or SHA
        required: false
        default: main

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Code Testing
        run: pnpm run test
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Code Linting
        run: pnpm run lint
  e2e:
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      frontend_repository: ${{ github.repository }}
      frontend_ref: ${{ github.sha }}
      backend_repository: ${{ inputs.backend_repository }}
      backend_ref: ${{ inputs.backend_ref }}
      docker_repository: ${{ inputs.docker_repository }}
      docker_ref: ${{ inputs.docker_ref }}
  release:
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Create release
        run: |
          release_args=(--ci --verbose)
          [[ -n "$TYPE_ARG" ]] && release_args+=("$TYPE_ARG")
          [[ -n "$BETA_ARG" ]] && release_args+=("$BETA_ARG")
          [[ -n "$DRY_ARG" ]] && release_args+=("$DRY_ARG")
          pnpm run release "${release_args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPE_ARG: ${{ fromJSON('{"auto":"", "patch":"--patch", "minor":"--minor", "major":"--major"}')[github.event.inputs.type] }}
          BETA_ARG: ${{ github.event.inputs.beta == 'true' && '--preRelease=beta' || '' }}
          DRY_ARG: ${{ github.event.inputs.dry == 'true' && '--dry-run' || '' }}
